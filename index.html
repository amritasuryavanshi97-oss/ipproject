<body>

<!-- LOGIN VIEW -->
<div id="loginView" class="login-wrapper">
  <div class="login-card">
    <div class="brand center"><span class="brand-mark">A</span> AICTE Activity Tracker</div>
    <h2>Sign in to your account</h2>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="email">Email / Username</label>
        <input type="text" id="email" required placeholder="user@college.edu">
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      
      <div class="input-group">
        <label for="role">Sign in as</label>
        <select id="role">
          <option value="student">Student</option>
          <option value="faculty">Faculty / Mentor</option>
        </select>
      </div>
      
      <button type="submit" class="primary-btn full-width">Sign In</button>
    </form>
  </div>
</div>

<!-- MAIN DASHBOARD (Hidden initially) -->
<div id="appView" class="hidden">
  
  <!-- YOUR EXISTING HEADER GOES HERE -->
  <header class="topbar">
    <!-- ... -->
  </header>

  <!-- YOUR EXISTING STUDENT MAIN GOES HERE -->
  <main id="studentView">
    <!-- ... -->
  </main>

  <!-- YOUR EXISTING FACULTY MAIN GOES HERE -->
  <main id="facultyView" class="hidden">
    <!-- ... -->
  </main>

  <!-- YOUR EXISTING FOOTER & TOAST GO HERE -->
  <div id="toast" class="toast" role="status"></div>
  <footer><p>© 2026 AICTE Activity Tracker</p></footer>

</div>

<script src="script.js"></script>
</body>
